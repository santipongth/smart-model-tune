server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker's embedded DNS — lets nginx re-resolve the backend if its IP changes
    resolver 127.0.0.11 valid=30s;
    # ⬇️ เปลี่ยน engine-backend:8080 เป็น <ชื่อ backend container>:<พอร์ตภายใน>
    set $backend "http://slm-api:8000";

    # REST API → backend container
    location /api/v1/ {
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # WebSocket (training progress) → backend container
    location /ws/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # Health check passthrough
    location /health {
        proxy_pass $backend;
    }

    # SPA fallback — React Router handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
